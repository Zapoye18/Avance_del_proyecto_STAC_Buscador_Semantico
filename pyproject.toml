[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stac-buscador-semantico"
version = "0.1.0"
description = "Clasificación y búsqueda documental"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
     "uvicorn>=0.30,<1.0",
     "pydantic"
]

[tool.setuptools.packages.find]
include = ["app*"]